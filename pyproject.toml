[project]
name = "passgen"
version = "0.1.0"
description = "Make cryptographically secure passwords in python"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Juvid Aryaman", email = "j.aryaman25@gmail.com" }]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
passgen = "passgen:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
